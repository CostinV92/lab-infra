services:
  omada:
    container_name: omada
    image: mbentley/omada-controller:6.3
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 4096
        hard: 8192
    stop_grace_period: 60s
    ports:
      - 8088:8088
      - 8043:8043
      - 8044:8044
      - 8843:8843
      - 19810:19810/udp
      - 27001:27001/udp
      - 29810:29810/udp
      - 29811-29817:29811-29817
    environment:
      - PUID=${USER_ID}
      - PGID=${GROUP_ID}
      - MANAGE_HTTP_PORT=8088
      - MANAGE_HTTPS_PORT=8043
      - PORTAL_HTTP_PORT=8088
      - PORTAL_HTTPS_PORT=8843
      - UPGRADE_HTTPS_PORT=8043
      - UPGRADE_ES_HTTPS_PORT=8044
      - PORT_APP_DISCOVERY=27001
      - PORT_DISCOVERY=29810
      - PORT_MANAGER_V1=29811
      - PORT_ADOPT_V1=29812
      - PORT_UPGRADE_V1=29813
      - PORT_MANAGER_V2=29814
      - PORT_TRANSFER_V2=29815
      - PORT_RTTY=29816
      - PORT_DEVICE_MONITOR=29817
      - WEB_CONFIG_OVERRIDE=false
      - SHOW_SERVER_LOGS=true
      - SHOW_MONGODB_LOGS=false
      - SSL_CERT_NAME=tls.crt
      - SSL_KEY_NAME=tls.key
      - TZ=Etc/UTC
    volumes:
      - ${OMADA_DATA}:/opt/tplink/EAPController/data
      - ${OMADA_LOGS}:/opt/tplink/EAPController/logs
    networks:
      - omada_network

networks:
  omada_network:
    driver: bridge
    ipam:
      config:
        - subnet: ${OMADA_NETWORK}
