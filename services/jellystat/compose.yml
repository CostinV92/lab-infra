services:
  jellystat-db:
    image: postgres:18.1
    shm_size: "1gb"
    container_name: jellystat-db
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-file: "5"
        max-size: "10m"
    environment:
      POSTGRES_USER: ${JELLYSTAT_POSTGRES_USER}
      POSTGRES_PASSWORD: ${JELLYSTAT_POSTGRES_PASSWORD}
    volumes:
      - ${JELLYSTAT_POSTGRES_DATA}:/var/lib/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready --dbname=postgres --username=postgres
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - jellystat_network

  jellystat:
    image: cyfershepard/jellystat:latest
    container_name: jellystat
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-file: "5"
        max-size: "10m"
    environment:
      POSTGRES_USER: ${JELLYSTAT_POSTGRES_USER}
      POSTGRES_PASSWORD: ${JELLYSTAT_POSTGRES_PASSWORD}
      POSTGRES_IP: jellystat-db
      POSTGRES_PORT: 5432
      JWT_SECRET: ${JELLYSTAT_JWT_SECRET} #eg: "my-secret-jwt-key" -  please set this to a random string for security purposes
      TZ: Europe/Bucharest
    volumes:
      - ${JELLYSTAT_BACKUP_DATA}:/app/backend/backup-data
    ports:
      - "${JELLYSTAT_PORT}:3000"
    depends_on:
      jellystat-db:
        condition: service_healthy
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:3000/auth/isConfigured || exit 1
      interval: 60s
      timeout: 30s
      retries: 5
      start_period: 30s
    networks:
      - jellystat_network

networks:
  jellystat_network:
    driver: bridge
    ipam:
      config:
        - subnet: ${JELLSTAT_NETWORK}
