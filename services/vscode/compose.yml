---
services:
  code-server:
    image: lscr.io/linuxserver/code-server:latest
    container_name: vscode
    environment:
      - PUID=${USER_ID}
      - PGID=${GROUP_ID}
      - TZ=Europe/Bucharest
      # - PASSWORD=password #optional
      # - HASHED_PASSWORD= #optional
      # - SUDO_PASSWORD=password #optional
      # - SUDO_PASSWORD_HASH= #optional
      # - PROXY_DOMAIN=code-server.my.domain #optional
      - DEFAULT_WORKSPACE=/workspace #optional
      - PWA_APPNAME=vscode #optional
    volumes:
      - ${VSCODE_DATA}/config:/config
      - ${VSCODE_DATA}/workspace:/workspace
      - ${VSCODE_SSH}:/config/.ssh
    ports:
      - ${VSCODE_PORT}:8443
    restart: unless-stopped
    networks:
      - vscode_network

networks:
  vscode_network:
    driver: bridge
    ipam:
      config:
        - subnet: ${VSCODE_NETWORK}